name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend/internship-portal-frontend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/internship-portal-frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend/internship-portal-frontend
        run: npm ci
      - name: Build
        working-directory: frontend/internship-portal-frontend
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/internship-portal-frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend/internship-portal-frontend
        run: npm ci
      - name: Lint
        working-directory: frontend/internship-portal-frontend
        run: npm run lint --if-present
